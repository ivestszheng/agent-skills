name: Skill Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: skill-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: Auto bump skill versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate skill frontmatter
        run: node scripts/validate-skills.mjs

      - name: Bump skill versions
        shell: bash
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          node scripts/bump-skill-versions.mjs --range "$RANGE"
          if ! git diff --quiet -- skills; then
            git add skills
            git commit -m "chore: 自动更新 skill 版本号"
          fi

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
